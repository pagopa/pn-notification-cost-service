AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Parameters:
  ProjectName:
    Type: String
    Description: 'Usually pn can be pnXYZ where XYZ are the feature number, useful to create
      experimental environments without crash official development environment'

  AlarmSNSTopicArn:
    Type: String
    Description: ARN of alarm topic

  WebApiDnsName:
    Type: String
    Description: 'The DNS name used for WEB rest API.'
  
  CorsAllowedDomains:
    Type: String
    Description: 'Comma separated list of domains allowed to make cross origin request'

  ContainerImageUri:
    Type: String
    Description: 'Exact container image URI with full repository and image digest'

  MicroserviceNumber:
    Type: Number
    Description: 'Disambiguation useful for load balancer rules'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'The S3 bucket from which to fetch the templates used by this stack.'

  ECSClusterName:
    Type: String
    Description: 'The name of the ECS cluster where the microservice is going to be deployed'

  SubnetsIds:
    Type: CommaDelimitedList
    Description: 'subnets ids comma separated list. Where to deploy the microservice'

  VpcId:
    Type: String
    Description: 'VpcId where the microservice is going to be deployed'
  
  EcsDefaultSecurityGroup:
    Type: String
    Description: 'Default security group required by infrastructure'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'Load balancer listener where HTTP endpoints is going to be registered'

  ApplicationLoadBalancerDomain:
    Type: String
    Description: 'Base URL of the load balancer where the service is going to be reachable'

  NetworkLoadBalancerLink:
    Type: String
    Description: 'network load balancer link for API-GW'
  
  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Kinesis stream that receive logs'
  
  # Instance parameters
  # 256 (.25 vCPU) - Available memory values: 0.5GB, 1GB, 2GB
  # 512 (.5 vCPU) - Available memory values: 1GB, 2GB, 3GB, 4GB
  # 1024 (1 vCPU) - Available memory values: 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB
  # 2048 (2 vCPU) - Available memory values: Between 4GB and 16GB in 1GB increments
  # 4096 (4 vCPU) - Available memory values: Between 8GB and 30GB in 1GB increments
  CpuValue:
    Type: Number
    Default: 1024
    Description: Fargate virtual CPU quantity 1024 equals one vCPU (Validator task)
  
  # 0.5GB, 1GB, 2GB - Available cpu values: 256 (.25 vCPU)
  # 1GB, 2GB, 3GB, 4GB - Available cpu values: 512 (.5 vCPU)
  # 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB - Available cpu values: 1024 (1 vCPU)
  # Between 4GB and 16GB in 1GB increments - Available cpu values: 2048 (2 vCPU)
  # Between 8GB and 30GB in 1GB increments - Available cpu values: 4096 (4 vCPU)
  MemoryAmount:
    Type: String
    Default: 2GB
    Description: memory amount reserved to the task pod (Validator task)
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]
  
  # Autoscaling parameters
  AutoscalingCheckPeriod:
    Default: 60
    Type: Number
    Description: minimum autoscaling number of tasks
  
  AutoscalingThreshold:
    Default: 70
    Type: String
  
  AlbSecurityGroup:
    Type: String
    Description: 'Application load balancer security group'
  
  ApplicativeEnvFileChecksum:
    Type: String
    Default: ''
    Description: 'Applicative environment variable file checksum'
  
  MinTasksNumber:
    Default: 1
    Type: Number
    Description: minimum autoscaling number of tasks (task)
  
  MaxTasksNumber:
    Default: 6
    Type: Number
    Description: maximum autoscaling number of tasks (task)
  
  AutoscalingDataPointN:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M (task)
  
  AutoscalingDataPointM:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M (task)
  
  Version:
    Type: String
    Description: 'keep track of used projects commitIds'
  
  # Logging parameters
  WireTapLogActivation:
    Type: String
    Default: false
    Description: Activation of wire logs
    AllowedValues:
      - true
      - false
  
  PnCronAnalyzer:
    Type: String
    Default: '-'
    Description: Cron for which you send the metric to CloudWatch
  
  # EFS parameters
  FargateEFSFileSystemID:
    Type: String
    Description: "EFS Filesystem"
  
  MountEfs:
    Type: String
    Default: false
    AllowedValues:
      - "true"
      - "false"
    
  # Heath Check parameters
  HealthCheckInterval:
    Description: Seconds between two health check
    Type: Number
    Default: 60
  
  HealthCheckTimeout:
    Description: health check timeout seconds
    Type: Number
    Default: 5
  
  HealthyThresholdCount:
    Description: |
      The number of consecutive health checks successes required before considering
      an unhealthy target healthy.
    Type: Number
    Default: 5
  
  UnhealthyThresholdCount:
    Description: |
      The number of consecutive health check failures required before considering a target unhealthy.
    Type: Number
    Default: 2
    
  # Log group parameters
  EcsNotificationCostServiceLogGroup:
    Type: String
    Description: 'Ecs log group name (Notification Cost Service task)'
  
  LogAlarmStrategy:
    Type: String
    Default: 'FATAL'
  
  # --- Dynamo Table ---
  NotificationDeliveryCostTableName:
    Type: String
    Description: 'Name of dynamodb table containing cost of notification delivery'
  
  NotificationDeliveryCostTableArn:
    Type: String
    Description: 'ARN of dynamodb table containing cost of notification delivery '

  PaymentInfoTableName:
    Type: String
    Description: 'Name of dynamodb table containing info about payments'

  PaymentInfoTableArn:
    Type: String
    Description: 'ARN of dynamodb table containing info about payments'

  # --- Sqs ---
  PnNotificationCostToUpdateQueueName:
    Type: String
    Description: 'The name of the SQS queue used to communicate with pn-notification-cost-service module.'

  PnNotificationCostToUpdateQueueARN:
    Type: String
    Description: 'Identify the resource that the policy applies to.'

  PnNotificationCostToUpdateQueueAlarmARN:
    Type: String
    Description: 'Identify the resource that the policy applies to.'

  PaymentInfoTableName:
    Type: String
    Description: 'Name of dynamodb table containing info about payments'

  PaymentInfoTableArn:
    Type: String
    Description: 'ARN of dynamodb table containing info about payments'

  # --- Sqs ---
  PnNotificationCostToUpdateQueueName:
    Type: String
    Description: 'The name of the SQS queue used to communicate with pn-notification-cost-service module.'

  PnNotificationCostToUpdateQueueARN:
    Type: String
    Description: 'Identify the resource that the policy applies to.'

  PnNotificationCostToUpdateQueueAlarmARN:
    Type: String
    Description: 'Identify the resource that the policy applies to.'

  PnNotificationCostToUpdateQueueURL:
    Type: String
    Description: 'Notification cost to update queue URL'

  MicroserviceBucketBaseKey:
    Type: String
    Default: ''
    Description: 'Base key of the microservice in the s3 bucket'

  CostEventUpdateLambdaBatchSize:
    Type: Number
    Default: 60
    Description: 'BatchSize event source mapping'

  CdcKinesisSourceStreamKeyId:
    Type: String
    Default: ''
    Description: 'KMS Key ID for the CDC Kinesis stream'

  ESMKinesisFailureNotificationsBucketName:
    Type: String
    Description: "S3 bucket name for ESM Kinesis failure notifications"

  # OpenApi Bucket params
  MicroserviceBucketName:
    Type: String
    Default: ''
    Description: 'Name of the bucket where the microservice files are copied during deploy'

  CostEventUpdateLambdaMaximumBatchingWindowInSeconds:
    Type: Number
    Default: 20
    Description: 'MaximumBatchingWindow asseveration event source mapping'

  CostEventUpdateLambdaMaximumRecordAge:
    Type: Number
    Description: "Maximum record age in seconds for CostEventUpdateLambdaKinesisSource"
    Default: 604800 # 7 days

  CostEventUpdateLambdaEventCategories:
    Type: CommaDelimitedList
    Description: "Comma-separated list of timeline categories accepted by CostEventUpdateLambdaKinesisSource filter"
    Default: SEND_ANALOG_DOMICILE,SEND_SIMPLE_REGISTERED_LETTER,NOTIFICATION_CANCELLED,REQUEST_REFUSED

  NewWorkflowLambdasEnabledStart:
    Type: String
    Description: 'Start date in EPOCH millis format (important!) for lambdas enabled'

  NewWorkflowLambdasEnabledEnd:
    Type: String
    Description: 'End date in EPOCH millis format (important!) for lambdas enabled'

  CdcKinesisSourceStreamName:
    Type: String
    Description: 'Name of the kinesis stream where CDC are sent'

  UpdateCostFeatureDate:
    Type: String
    Description: 'Feature date from which activate the feature flag'

  CostEventUpdateLambdaName:
    Type: String
    Description: 'Name of the cost event update lambda'

Resources:
  # PN-Notification-Cost-Service microservice
  NotificationCostServiceMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/ecs-service.yaml"
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-notification-cost-service'
        CpuValue: !Ref CpuValue
        CpuArchitecture: ARM
        MemoryAmount: !Ref MemoryAmount
        HealthCheckTimeout: !Ref HealthCheckTimeout
        HealthCheckInterval: !Ref HealthCheckInterval
        HealthyThresholdCount: !Ref HealthyThresholdCount
        UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
        AutoscalingStrategy: REST-API
        AutoscalingThreshold: !Ref AutoscalingThreshold
        AutoscalingCheckPeriod: !Ref AutoscalingCheckPeriod
        MinTasksNumber: !Ref MinTasksNumber
        MaxTasksNumber: !Ref MaxTasksNumber
        AutoscalingDataPointN: !Ref AutoscalingDataPointN
        AutoscalingDataPointM: !Ref AutoscalingDataPointM
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        EfsFilesystem: !Ref FargateEFSFileSystemID
        WireTapLogActivation: !Ref WireTapLogActivation
        MountEfs: !Ref MountEfs
        ContainerImageURI: !Sub '${ContainerImageUri}'
        ContainerEnvEntry1: !Sub 'AWS_REGIONCODE=${AWS::Region}'
        ContainerEnvEntry2: !Sub 'PN_CRON_ANALYZER=${PnCronAnalyzer}'
        ContainerEnvEntry3: !Sub 'WIRE_TAP_LOG=${WireTapLogActivation}'
        ContainerEnvEntry4: !Sub 'CORS_ALLOWED_DOMAINS=${CorsAllowedDomains}'
        ContainerEnvEntry5: !Sub 'PN_NOTIFICATIONCOSTSERVICE_NOTIFICATIONDELIVERYCOSTTABLE_TABLENAME=${NotificationDeliveryCostTableName}'
        ContainerEnvEntry6: !Sub 'PN_NOTIFICATIONCOSTSERVICE_PAYMENTINFOTABLE_TABLENAME=${PaymentInfoTableName}'
        ContainerEnvEntry7: !Sub 'PN_NOTIFICATIONCOSTSERVICE_TOPICS_PNNOTIFICATIONCOSTTOUPDATE=${PnNotificationCostToUpdateQueueName}'
        ContainerEnvEntry8: !Sub 'PN_NOTIFICATIONCOSTSERVICE_EVENTBUS_NAME=arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectName}-CoreEventBus'
        ContainerEnvEntry9: 'PN_NOTIFICATIONCOSTSERVICE_EVENTBUS_SOURCE=pn-notification-cost-service'
        ContainerEnvEntry10: 'PN_NOTIFICATIONCOSTSERVICE_EVENTBUS_OUTCOMEEVENTDETAILTYPE=NotificationCostServiceOutcomeEvent'
        ApplicativeEnvFileChecksum: !Ref ApplicativeEnvFileChecksum
        JavaToolOptions: '-Dreactor.netty.ioWorkerCount=50'
        MappedPaths: '/notification-cost-private/*'
        ECSClusterName: !Ref ECSClusterName
        Subnets: !Join [ ',', !Ref SubnetsIds ]
        VpcId: !Ref VpcId
        EcsDefaultSecurityGroup: !Ref EcsDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref ApplicationLoadBalancerListenerArn
        LoadbalancerRulePriority: !Ref MicroserviceNumber
        TaskRoleManagedPolicyArn: !Ref NotificationCostServiceMicroserviceTaskManagedPolicy
        AlbSecurityGroup: !Ref AlbSecurityGroup
        EcsLogGroup: !Ref EcsNotificationCostServiceLogGroup
        LogAlarmStrategyV1: !Ref LogAlarmStrategy
        
  NotificationCostServiceMicroserviceCloudWatchDashboard:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/microservice-cloudwatch-dashboard.yaml"
      Parameters:
        DashboardName: !Sub "${ProjectName}-notification-cost-service"
        DynamoDBTableNames: !Join
          - ','
          - - !Ref NotificationDeliveryCostTableName
            - !Ref PaymentInfoTableName
        AlarmArns: !Join
          - ','
          - - !GetAtt NotificationCostServiceMicroservice.Outputs.FatalLogsMetricAlarmArn
            - !Ref PnNotificationCostToUpdateQueueAlarmARN
        QueueArns: !Ref PnNotificationCostToUpdateQueueARN
        LogGroupsNames: !Sub '/aws/ecs/${ProjectName}-notification-cost-service'

  # Grant operational rights to Pn-NotificationCostService microservice
  NotificationCostServiceMicroserviceTaskManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'dynamodb:GetItem'
              - 'dynamodb:PutItem'
              - 'dynamodb:UpdateItem'
            Resource:
              - !Sub "${NotificationDeliveryCostTableArn}"
              - !Sub "${PaymentInfoTableArn}"
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:ReceiveMessage
            Resource:
              - !Ref PnNotificationCostToUpdateQueueARN
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectName}-CoreEventBus
              - !Sub "${PaymentInfoTableArn}"
          - Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:ReceiveMessage
            Resource:
              - !Ref PnNotificationCostToUpdateQueueARN
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectName}-CoreEventBus

  #########################################################
  ###               CostEventUpdateLambda               ###
  #########################################################

  # Lambda function
  CostEventUpdateLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref CostEventUpdateLambdaName
      Runtime: nodejs22.x
      Handler: "index.handler"
      Code:
        S3Bucket: !Ref MicroserviceBucketName
        S3Key: !Sub "${MicroserviceBucketBaseKey}/functions_zip/costEventUpdate.zip"
      Role: !GetAtt CostEventUpdateLambdaRole.Arn
      Environment:
        Variables:
          REGION: !Sub ${AWS::Region}
          FEATURE_DATE: !Ref UpdateCostFeatureDate
          QUEUE_URL: !Ref PnNotificationCostToUpdateQueueURL
      TracingConfig:
        Mode: Active
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:339249233099:layer:LambdaInsightsExtension:13"
      Timeout: 10

  # Lambda function role
  CostEventUpdateLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-CostEventUpdateLambdaRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda function IAM policy
  CostEventUpdateLambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-CostEventUpdateLambdaPolicy
      Roles:
        - !Ref CostEventUpdateLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - kinesis:DescribeStream
              - kinesis:DescribeStreamSummary
              - kinesis:GetShardIterator
              - kinesis:GetRecords
              - kinesis:ListShards
              - kinesis:ListStreams
              - kinesis:SubscribeToShard
            Resource: !Sub arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${CdcKinesisSourceStreamName}
          - Action: kms:Decrypt
            Effect: Allow
            Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/${CdcKinesisSourceStreamKeyId}
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SendMessage
            Resource:
              !Ref PnNotificationCostToUpdateQueueARN
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !Sub arn:aws:s3:::${ESMKinesisFailureNotificationsBucketName}
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub arn:aws:s3:::${ESMKinesisFailureNotificationsBucketName}/*

    # CDC to Cost Event Update
  CostEventUpdateLambdaKinesisSource:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: CostEventUpdateLambdaPolicy
    Properties:
      BatchSize: !Ref CostEventUpdateLambdaBatchSize
      BisectBatchOnFunctionError: true
      EventSourceArn: !Sub arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${CdcKinesisSourceStreamName}
      FunctionName: !Ref CostEventUpdateLambda
      FunctionResponseTypes:
        - ReportBatchItemFailures
      FilterCriteria:
        Filters:
          - Pattern: !Join
              - ''
              - - '{ "data": { "tableName": ["pn-Timelines"], "eventName": ["INSERT"], "dynamodb": { "NewImage": { "category": { "S": ["'
                - !Join [ '","', !Ref CostEventUpdateLambdaEventCategories ]
                - '"] } } } } }'
      MaximumBatchingWindowInSeconds: !Ref CostEventUpdateLambdaMaximumBatchingWindowInSeconds
      MaximumRecordAgeInSeconds: !Ref CostEventUpdateLambdaMaximumRecordAge
      StartingPosition: TRIM_HORIZON
      DestinationConfig:
        OnFailure:
          Destination: !Sub arn:aws:s3:::${ESMKinesisFailureNotificationsBucketName}

  CostEventUpdateKinesisFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-CostEventUpdate-ESM-Alarm"
      AlarmDescription: "CloudWatch alarm for when CostEventUpdateLambda has Kinesis stream read failures, which can indicate problems with the function processing or with the stream itself."
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      OKActions:
        - !Ref AlarmSNSTopicArn
      Dimensions:
        - Value: !Ref CostEventUpdateLambda
          Name: FunctionName
        - Value: !Ref CdcKinesisSourceStreamName
          Name: StreamName
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 6
      Period: 600
      Namespace: ESM/Kinesis
      MetricName: ProcessingFailures
      Statistic: Maximum
      Threshold: 1

  CostEventUpdateLambdaAlarms:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/lambda-alarms.yaml"
      Parameters:
        FunctionName: !Ref CostEventUpdateLambda
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn