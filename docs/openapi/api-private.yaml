openapi: 3.0.3
info:
  title: 'API di notification cost service'
  x-summary: 'API di notification cost service'
  x-api-id: api-internal-pn-notification-cost-service
  version: '1.0.0'
  description: >-
    Servizio interno per il calcolo e la gestione dei costi di notificazione per i destinatari della piattaforma SEND.
paths:
  "/notification-cost-private/cost/{iun}/recipient/{recIndex}":
    get:
      operationId: NotificationCostRecipient
      summary: Retrieve notification cost for recipient
      description: >-
        Servizio che restituisce il costo di notificazione per il singolo destinatario
      tags:
        - NotificationCostRecipient
      parameters:
        - name: iun
          in: path
          required: true
          description: Identificativo Univoco Notifica (IUN)
          schema:
            type: string
          example: '00000000-0000-0000-0000-000000000000'
        - name: recIndex
          in: path
          required: true
          description: Index destinatario notifica digitale
          schema:
            type: integer
            format: int32
          example: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCostRecipientResponse'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  "/notification-cost-private/cost/{iun}":
    post:
      operationId: initializeNotificationCost
      summary: "Initialize notification cost for all recipients"
      description: " Servizio che inizializza il costo di notificazione per lo IUN indicato per tutti i destinatari della notifica."
      tags:
        - NotificationCostRecipient
      parameters:
        - name: iun
          in: path
          required: true
          description: Identificativo Univoco Notifica (IUN)
          schema:
            type: string
          example: '00000000-0000-0000-0000-000000000000'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNotificationCostRequest'
      responses:
        '202':
          description: ACK - Richiesta elaborata correttamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAccepted'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    NewNotificationCostRequest:
      type: object
      required:
        - costRecipients
      properties:
        costRecipients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipientCostData'
    
    RequestAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            Always "OK"
    
    RecipientCostData:
      type: object
      required:
        - recIndex
        - recipientInternalId
        - baseCost
        - senderInternalId
        - sendFee
        - paFee
        - notificationFeePolicy
        - pagoPaIntMode
        - vat
      properties:
        recIndex:
          type: integer
          format: int32
          description: Indice identificativo del destinatario
        recipientInternalId:
          type: string
          description: ID anonimizzato del destinatario
        senderInternalId:
          type: string
          description: ID anonimizzato del mittente
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentData'
        baseCost:
          type: integer
          format: int32
          minimum: 0
          description: Costo base dato da sendFee + paFee (in eurocent)
        sendFee:
          type: integer
          format: int32
          minimum: 0
          description: Costo base di SeND per notificazione (in eurocent)
        paFee:
          type: integer
          format: int32
          minimum: 0
          description: Costo base dell'ente per notificazione (in eurocent)
        notificationFeePolicy:
          $ref: '#/components/schemas/NotificationFeePolicy'
        pagoPaIntMode:
          $ref: '#/components/schemas/PagoPaIntMode'
        vat:
          $ref: '#/components/schemas/Vat'
    
    PaymentData:
      type: object
      required:
        - iuv
        - applyCost
      properties:
        iuv:
          type: string
          description: IUV del bollettino di pagamento
        applyCost:
          type: boolean
          description: Indica se applicare o meno i costi di notificazione
    NotificationCostRecipientResponse:
      title: Notification cost Response for recipient
      description: >-
        Dati relativi al costo totale e alla modalità di aggiornamento per il destinatario.
      type: object
      required: [ totalCost, pagoPaIntMode, lastUpdate ]
      properties:
        pagoPaIntMode:
          $ref: '#/components/schemas/PagoPaIntMode'
        lastUpdate:
          type: string
          format: date-time
          description: Data dell'ultimo aggiornamento dei costi di notificazione
        totalCost:
          $ref: '#/components/schemas/TotalCost'

    TotalCost:
      title: Costo di notificazione applicato al destinatario
      description: >-
        Rappresentazione del costo totale (comprensivo di oneri e tributi) in eurocent.
      type: object
      required: [ costWithVat, details ]
      properties:
        costWithVat:
          description: Costo totale in eurocent (somma algebrica dei dettagli) comprensivo di IVA
          type: integer
          format: int32
        details:
          $ref: '#/components/schemas/TotalCostDetails'
    
    TotalCostDetails:
      title: Dettaglio del costo totale per il destinatario
      description: >-
        Scomposizione del costo di notifica in base alle diverse componenti di invio.
      type: object
      required: [ baseCostDetail, notificationFeePolicy ]
      properties:
        notificationFeePolicy:
          $ref: '#/components/schemas/NotificationFeePolicy'
        baseCostDetail:
          description: Dettaglio del costo base di notificazione
          $ref: '#/components/schemas/BaseCostDetail'
        analogCostDetail:
          description: Dettaglio del costo anlogico di notificazione
          $ref: '#/components/schemas/AnalogCostDetail'

    PagoPaIntMode:
      type: string
      description: >-
        Modalità di integrazione pagoPA per l'attualizzazione del costo della notifica. <br/>
        - _NONE_: nessuna attualizzazione. <br/>
        - _SYNC_: modalità sincrona. <br/>
        - _ASYNC_: modalità asincrona. <br/>
      enum:
        - NONE
        - SYNC
        - ASYNC
    
    Vat:
      description: IVA applicata ai costi cartacei (es. 22)
      type: integer
      format: int32
      minimum: 0
      maximum: 100

    NotificationFeePolicy:
      type: string
      description: >-
        Politica di calcolo dei costi.
      enum:
        - FLAT_RATE
        - DELIVERY_MODE

    ProductType:
      type: string
      description: >
        Tipologia di prodotto postale utilizzato:
          - __AR__: Raccomandata nazionale A/R
          - __890__: Atto giudiziario (Legge 890/1982)
          - __RIR__: Raccomandata internazionale A/R
          - __RS__: Raccomandata Semplice
          - __RIS__: Raccomandata internazionale Semplice

    BaseCostName:
      type: string
      description: >-
          Nome della componente di costo.
          PA_FEE: Diritti di notifica spettanti alla Pubblica Amministrazione (in eurocent).
          SEND_FEE: Costi operativi della piattaforma SEND (in eurocent).
      enum:
          - PA_FEE
          - SEND_FEE

    BaseCostDetail:
      type: object
      required: [ cost, baseCostComponents ]
      properties:
        cost:
          description: Costo totale in eurocent (somma algebrica delle componenti) escluso IVA
          type: integer
          format: int32
        baseCostComponents:
          description: Elenco delle componenti di costo base che concorrono a formare il costo totale
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/BaseCostComponent'

    BaseCostComponent:
      description: Componente di costo base per la notificazione
      type: object
      required: [ cost, costName ]
      properties:
        cost:
          description: Costo della componente in eurocent in cui non è inclusa l'IVA
          type: integer
          format: int32
        costName:
          $ref: '#/components/schemas/BaseCostName'

    AnalogCostDetail:
      type: object
      required: [ costWithVat, vat, analogCostComponents ]
      properties:
        costWithVat:
          description: Costo totale in eurocent (somma algebrica delle componenti) comprensivo di IVA
          type: integer
          format: int32
        vat:
          $ref: '#/components/schemas/Vat'
        analogCostComponents:
          description: Elenco delle componenti di costo analogiche che concorrono a formare il costo totale
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AnalogCostComponent'

    AnalogCostName:
      type: string
      description: >-
        Nome della componente di costo.
        FIRST_ATTEMPT: Costo del primo tentativo di spedizione analogica (in eurocent).
        SECOND_ATTEMPT: Costo del secondo tentativo di spedizione analogica (in eurocent).
      enum:
        - FIRST_ATTEMPT
        - SECOND_ATTEMPT

    AnalogCostComponent:
      description: Componente di costo anlogica che concorre a formare il costo totale
      type: object
      required: [ cost, costName, productType ]
      properties:
       cost:
         description: Costo della componente in eurocent in cui non è inclusa l'IVA
         type: integer
         format: int32
       costName:
         $ref: '#/components/schemas/AnalogCostName'
       productType:
         $ref: '#/components/schemas/ProductType'

    Problem:
      $ref: './remote-refs.yaml#/components/schemas/Problem'
    ProblemError:
      $ref: './remote-refs.yaml#/components/schemas/ProblemError'